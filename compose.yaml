services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ai_court
      MYSQL_USER: court
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in the ignored .env file}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in the ignored .env file}
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - court_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  court_mysql:
